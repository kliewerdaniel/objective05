[package]
name = "objective-model-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
onnx = ["dep:ort"]
llama = ["dep:llama_cpp"]

[dependencies]
async-trait.workspace = true
chrono.workspace = true
objective-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
llama_cpp = { version = "0.3", optional = true, default-features = false, features = ["metal", "native"] }
ort = { version = "=2.0.0-rc.12", optional = true, default-features = false, features = ["std", "ndarray", "download-binaries", "copy-dylibs", "tls-native"] }

