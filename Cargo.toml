[workspace]
members = [
    "crates/core",
    "crates/message-bus",
    "crates/store",
    "crates/ingestion",
    "crates/extraction",
    "crates/correlation",
    "crates/scheduler",
    "crates/plugin-host",
    "crates/api-gateway",
    "crates/model-runtime",
    "crates/broadcast",
    "crates/audio",
    "crates/objective",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/anomalyco/objective"

[workspace.dependencies]
anyhow = "1.0"
async-nats = "0.48"
async-trait = "0.1"
axum = { version = "0.7", features = ["ws"] }
chrono = { version = "0.4", features = ["serde"] }
config = "0.14"
# Pinned to match the version kuzu 0.11 brings in transitively.
# cxx-build generates the C++ bridge with a versioned symbol name
# (e.g. `_kuzu_rs$cxxbridge1$<cxx-build-version>$value_get_string`),
# so the build-time crate and the runtime crate must agree exactly,
# otherwise the linker rejects the cxx shim symbols.
cxx = "=1.0.138"
cxx-build = "=1.0.138"
feed-rs = "2.3"
flate2 = "1.0"
futures = "0.3"
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3.10"
thiserror = "1.0"
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ulid = { version = "1.1", features = ["serde"] }
utoipa = { version = "4.2", features = ["axum_extras", "chrono", "ulid"] }
